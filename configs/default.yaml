# ACTUS default configuration. Override with `load_config("configs/<site>.yaml")` or
# `key.path=value` pairs. Each lane owns the meaning of its own section; an empty mapping ({})
# marks a free-form section. Relative paths are relative to the repo root.

run:
  runs_dir: runs                 # each run writes to runs/<run_id>/
  run_id: null                   # null → timestamp, e.g. 20260927-153012

protocol:
  path: protocols/bas_boxes.yaml

capture:                         # T-PERC (camera.py)
  source: 0                      # webcam index, file path, or rtsp:// URL
  source_id: cam0
  width: 1280
  height: 720
  fps: 30                        # requested from the device; the real clock is t_capture
  rotation: 0                    # rotate frames CCW before perception (0/90/180/270)

replay:                          # P0 synthetic source (actus/capture/replay.py)
  scenario: correct
  fps: 15
  seed: 0
  noise: 0.04
  realtime: true
  render: true                   # draw a labelled SIMULATED frame for UI / recorder testing

detector:                        # T-PERC (detector.py), T-DET-TRAIN
  backend: open_vocab            # open_vocab | custom
  custom_weights: models/detector/best.onnx
  open_vocab_weights: yolov8s-worldv2.pt
  prompts:
    red_box: red box
    yellow_box: yellow box
    outer_box_closed: cardboard box
    outer_box_open: open cardboard box
    lid: box lid
  conf: 0.25
  imgsz: 640
  tracker: bytetrack.yaml

perception:                      # T-PERC (handpose.py, rotation_tta.py)
  hands: true
  pose: true
  num_hands: 2
  pose_model: lite                              # lite | full | heavy (MediaPipe Pose variant)
  hand_model_path: models/perception/hand_landmarker.task
  pose_model_path: null           # null -> models/perception/pose_landmarker_<pose_model>.task
  min_hand_conf: 0.5
  min_pose_conf: 0.5
  rotation_tta:
    enabled: true
    conf_threshold: 0.5          # re-search rotations when mean landmark conf drops below
    every_n_frames: 30           # ...or periodically

rack:                            # T-SPATIAL (rack_frame.py)
  config: configs/rack.yaml
  min_markers: 3
  max_reproj_err_px: 4.0
  hold_frames: 45                # keep the last good pose this long through occlusion
  smooth_tau_s: 0.08             # time constant of the pose smoothing (0 = off)
  snap_px: 12.0                  # board corners jumping further than this re-lock at once

spatial: {}                      # T-SPATIAL (zones.py, world_state.py, predicates.py)

models:                          # T-HOI-TEMP
  enabled: true
  # Path stems, not files: <stem>.npz is the model of record (numpy, always loadable) and
  # <stem>.onnx is used instead when it exists and onnxruntime is installed.
  hoi: models/hoi/hoi
  temporal: models/temporal/temporal
  prefer_onnx: true
  feature_fps: 15                # fixed rate the temporal model consumes, whatever the camera does
  window_s: 2.0                  # receptive field it was trained with
  fusion:
    enabled: true
    temporal_weight: 0.5         # capped by the evidence's `armed` latch (actus/models/fusion.py)

voice:                           # T-VOICE
  enabled: true
  tts:
    engine: kokoro               # kokoro | pyttsx3
    kokoro_model: models/voice/kokoro-v1.0.onnx
    kokoro_voices: models/voice/voices-v1.0.bin
    voice: af_heart
    speed: 1.0
  queue:
    maxsize: 16
    dedup_s: 5.0
    ttl_s: {alert: 10.0, ask: 15.0, prompt: 8.0, info: 5.0}
  asr:
    enabled: true
    model: models/voice/vosk-model-small-en-us-0.15
    push_to_talk_key: space

stream:                          # T-IO (streamer.py)
  enabled: true
  target_ip: 127.0.0.1           # the "specific IP" the video is pushed to
  port: 8554
  paths: {raw: actus/raw, annotated: actus/annotated}
  mediamtx_bin: bin/mediamtx
  ffmpeg_bin: ffmpeg
  bitrate_kbps: 2500
  webrtc_port: 8889

record:                          # T-IO (recorder.py)
  enabled: true
  segment_s: 60
  raw: true
  annotated: true

log:                             # T-IO (eventlog.py, downlink.py)
  events_file: events.jsonl
  downlink_max_bytes: 4096

ui:                              # T-UI (server.py)
  host: 127.0.0.1
  port: 8000
  static_dir: ui/dist
  mjpeg_fallback: true

faults:                          # T-FAULT (actus/app/faults.py)
  enabled: false                 # attach the fault controller to live runs (or pass --faults)
  hotkeys: true                  # console keys o d f x n, when stdin is a terminal
  stale_frames: 3                # repeated identical frames before the stale-frame guard trips (0 = off)
  schedule: []                   # e.g. ["occlude@9-12", "dim@f90-135:gamma=4"] (seconds, or f<frame>)
  occlude: {region: [0.0, 0.0, 1.0, 1.0], max_covered: 0.5}   # region: x0,y0,x1,y1 as frame fractions
  dim: {gamma: 3.0, min_conf: null}     # gamma > 1 is darker; min_conf null = detector.conf
  freeze: {}
  drop_detector: {}
  kill_network: {}

pipeline:                        # T-INT (actus/app/pipeline.py)
  detector: config               # config (= detector.backend) | none | "package.module:factory"
  handpose: config               # config (= perception.*) | none | "package.module:factory"
  rack: aruco                    # aruco (measured rack.yaml) | selfcal (unmeasured rig) | factory
  evidence: spatial              # spatial | replay (replay source only: its SIMULATED stand-in)
  detector_every_n: 1            # run the detector on every Nth processed frame
  handpose_every_n: 1
  overlay: true                  # draw and publish the `annotated` stream
  stats_interval_s: 1.0

engine: {}                       # T-ENGINE DecisionParams overrides, e.g. vis_ask_after_s: 1.5
