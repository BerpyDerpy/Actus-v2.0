[project]
name = "actus"
version = "0.1.0"
description = "ACTUS: on-board human activity recognition that validates experiment protocols (SIH 26174)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    # contrib is a superset of opencv-python (includes cv2.aruco) and is what mediapipe pulls in.
    "opencv-contrib-python>=4.9",
]

# Heavy, lane-specific dependencies. `uv sync` installs only the base set; a lane that needs one
# of these runs `uv sync --extra <name>` (or `--all-extras`). Lanes propose changes here in their PR.
[project.optional-dependencies]
perception = [
    "ultralytics>=8.3",
    "mediapipe>=0.10.14",
    "onnxruntime>=1.18",
]
voice = [
    "kokoro-onnx>=0.4",
    "pyttsx3>=2.90",
    "vosk>=0.3.45",
    "sounddevice>=0.4.7",
]
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",  # fastapi.testclient.TestClient (HTTP + WebSocket) for tests/test_ui_server.py
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actus"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ui", "data", "models", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow unicode (×, →, °) in strings and comments

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
